[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "app/agb/page.tsx,app/datenschutz/page.tsx,app/impressum/page.tsx"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_BASE_URL"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["node-fetch"]

[functions."generate-image"]
  timeout = 60

[[plugins]]
  package = "@netlify/plugin-nextjs"
