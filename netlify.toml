
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # GA4 measurement IDs are public and embedded in client-facing JS.
  # Without this, the secrets scan flags the inlined "G-…" literal in
  # the built bundle as a leaked env-var value and fails the build.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_GA4_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"
